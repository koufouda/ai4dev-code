# Η Πυθία σε container:  docker compose up --build
services:
  pythia:
    # Η εικόνα φτιάχνεται από το Dockerfile αυτού του φακέλου.
    build: .
    # Θύρα 8000 του υπολογιστή → θύρα 8000 του container.
    ports:
      - "8000:8000"
    # Τα κλειδιά από το C:\ai4dev\.env: ΕΞΩ από τον φάκελο, ΔΕΝ μπαίνουν στην εικόνα, δίνονται όταν ξεκινά.
    env_file:
      - ../.env
    # Ρυθμίσεις που δεν είναι μυστικές.
    environment:
      # Το Ollama τρέχει στον υπολογιστή, όχι στο container.
      OLLAMA_API_BASE: http://host.docker.internal:11434
      # Η έκδοση (φαίνεται στο /health και σε κάθε log).
      APP_VERSION: "1.0"
      # Πού γράφονται τα logs μέσα στο container.
      LOG_DIR: /app/logs
    # Τα logs σε φάκελο του υπολογιστή: δεν χάνονται όταν σβήσει το container.
    volumes:
      - ./logs:/app/logs
    # Σε Linux, το host.docker.internal πρέπει να δηλωθεί (στο Docker Desktop υπάρχει ήδη).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Αν πέσει, ξαναξεκινά.
    restart: unless-stopped
