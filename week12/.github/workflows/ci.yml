# Η Πυθία στο GitHub Actions: σε κάθε push, tests και build· το eval με κλειδί μόνο όταν το ζητήσουμε.
name: Pythia CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 1. Γρήγορα και δωρεάν: χωρίς κλειδί.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Εγκατάσταση
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Κλειδιά στον κώδικα;
        run: python secret_scan.py
      - name: Tests
        run: pytest -v

  # 2. Χτίζεται η εικόνα Docker;
  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t pythia .

  # 3. Eval με το πραγματικό μοντέλο: μόνο με το κουμπί «Run workflow» (κοστίζει).
  eval:
    needs: tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Eval εργαλείων
        run: python ci_eval.py --min 0.8
        env:
          # Το κλειδί από τα Secrets του repository: ΠΟΤΕ μέσα στο αρχείο.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
